
<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>MSM Events | Fotoğraf Yönetimi</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #080808;
      color: #f5f0e5;
      font-family: Arial, sans-serif;
    }
    .panel {
      width: 100%;
      max-width: 520px;
      padding: 36px;
      border: 1px solid #806b3c;
      border-radius: 16px;
      background: #111;
      text-align: center;
      box-shadow: 0 15px 50px #0008;
    }
    .brand {
      color: #d6b76b;
      font-size: 13px;
      letter-spacing: 5px;
      margin-bottom: 18px;
    }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { color: #c5c0b5; line-height: 1.7; }
    .gold { color: #d6b76b; }
    a {
      display: inline-block;
      margin-top: 18px;
      padding: 14px 22px;
      border-radius: 6px;
      background: #d6b76b;
      color: #111;
      text-decoration: none;
      font-weight: bold;
    }
    .note { margin-top: 22px; font-size: 12px; color: #918a7d; }
  </style>
</head>
<body>
  <main class="panel">
    <div class="brand">MSM EVENTS</div>
    <h1>Fotoğraf Yönetimi</h1>
    <p>
      <span class="gold">Çalışmalarımız</span> bölümündeki
      fotoğrafları yönetmek için yönetim paneli.
    </p>
    <p>Kurulum tamamlandığında fotoğraflarını buradan ekleyebilecek ve silebileceksin.</p>
    <div class="note">MSM Events · Yönetim Paneli</div>
  </main>
</body>
</html>
